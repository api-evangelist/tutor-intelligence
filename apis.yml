name: Tutor Intelligence
description: >-
  Tutor Intelligence builds AI-powered robotic workers for industrial and logistics
  operations, delivered as robots-as-a-service. Its flagship Cassie palletizing robot
  handles material-handling tasks — palletizing, depalletizing, and case picking — in
  warehouses and factories without facility retrofits, and a humanoid robot, Sonny, is
  slated for late 2026. The company pairs on-robot autonomy with a human-in-the-loop
  teleoperation and data model, priced per robot-hour with no long-term contracts, and
  is backed by Union Square Ventures. No public developer API, SDK, or documentation
  surface is published as of this profiling; the company's public GitHub organization
  hosts internal tooling and open-source forks rather than a first-party product API.
